name: Quickstart verification
on:
  push:
    branches: [main, 'devrel/reproducible-quickstart']
    paths: ['QUICKSTART.md', 'CONTRIBUTING.md', 'scripts/quickstart-offline.cjs', 'ts/**', '.github/workflows/quickstart-check.yml']
  pull_request:
    paths: ['QUICKSTART.md', 'CONTRIBUTING.md', 'scripts/quickstart-offline.cjs', 'ts/**', '.github/workflows/quickstart-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix ts
      - name: Build and run existing tests
        run: npm test --prefix ts
      - name: Execute documented offline example
        run: node scripts/quickstart-offline.cjs
