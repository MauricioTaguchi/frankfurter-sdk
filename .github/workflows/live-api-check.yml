name: Live API verification
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/smoke-live.cjs', '.github/workflows/live-api-check.yml']
permissions:
  contents: read
jobs:
  historical-api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix ts
      - name: Build the actual SDK
        run: npm run build --prefix ts
      - name: Read the public API and verify historical results
        timeout-minutes: 2
        run: node scripts/smoke-live.cjs
